<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="1964年から2022年まで。建物を建てて、となりどうしで稼ぎを増やし、オイルショックもバブルも街ごと乗りこえる経済ゲーム。AZAKEI（麻経）制作。">
<meta property="og:title" content="AZAKEI CITY">
<meta property="og:description" content="1964→2022。60年の経済を、街ごと生き抜け。AZAKEI（麻経）の経済ゲーム。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#12142b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2312142b'/%3E%3Cpath d='M12 3 20 16.5H4Z M12 21 4 7.5h16Z' fill='none' stroke='%23ffc83a' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>AZAKEI CITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho+B1:wght@700;800&family=DM+Mono:wght@500&display=swap">
<style>html{color-scheme:dark}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: night city seen from above — 11×11 lots on the left, a trading-desk side panel (era, shared market, preview, landmarks, ranking) on the right; stacks on phones with a bottom build dock.
   Single deliberate night look whose sky shifts by era (Showa amber → Heisei blue → Reiwa violet); gold for value, the six AZAKEI MARKET industry colors for buildings, newspaper cream for settlements. */
:root{
  --night:#12142b; --night2:#1b1e40; --lot:#20244c; --line:#2f3466;
  --ink:#eef0ff; --muted:#9ba1cc; --gold:#ffc83a; --gold-ink:#2a1d00;
  --up:#3ad283; --down:#ff6b5e; --paper:#fbf3dc; --paper-ink:#24180a; --paper-red:#b8261b;
  --i0:#ff7a3d; --i1:#eab520; --i2:#5f86ff; --i3:#ff5c9a; --i4:#20c6d1; --i5:#a77bff;
  --ho:#e9dcc0; --sys:#ffc83a;
  --lion:#e0a12a; --fox:#ff8a3d; --turtle:#4fb35a; --rabbit:#ff7aa8;
  --sky:#3a2a3a; --glow:#ffb85c;
  --c:var(--muted);
  --display:"Dela Gothic One","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Yu Gothic","Meiryo",sans-serif;
  --serif:"Shippori Mincho B1","Yu Mincho",serif;
  --mono:"DM Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-age="heisei"]{--sky:#1d3266;--glow:#6cbcff}
:root[data-age="reiwa"]{--sky:#33206a;--glow:#d08bff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-weight:500;font-size:14px;line-height:1.6;
  background:radial-gradient(1200px 640px at 30% -12%,var(--sky) 0,transparent 62%),var(--night);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;border:0;background:none;padding:0;text-align:left;color:inherit}
.brand svg{width:34px;height:34px;color:var(--gold)}
.brand .h1{display:block;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1}
.brand .sub2{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.tabs{display:flex;background:var(--night2);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
.nick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.nick input{width:8.5em;background:var(--night2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font:inherit;font-weight:700}
.me-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--night2);border-radius:999px;padding:4px 12px 4px 6px;font-size:12px;font-weight:800}
.me-chip .face{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 26%,transparent);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--night2);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:1fr}}

/* stats */
.stats{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:end;margin-bottom:12px}
.stat .lab{font-size:11px;color:var(--muted);letter-spacing:.08em}
.stat .num{font-family:var(--display);font-size:34px;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums}
.stat .era{font-family:var(--serif);font-weight:800;font-size:19px;line-height:1.25}
.stat .era b{font-family:var(--mono);font-weight:500;color:var(--gold);margin-right:6px}
.gengo{font-family:var(--serif);font-size:12px;font-weight:800;color:var(--glow);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:3px;white-space:nowrap}
.stat.right{text-align:right}
.stat .small{font-size:12px;color:var(--muted)}
.spark{grid-column:1/-1;height:36px;width:100%}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat.mid{grid-column:1/-1;order:-1}.stat .num{font-size:28px}}

/* era timeline */
.timeline{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:2px 0 12px}
.timeline span{height:22px;border-radius:4px;background:var(--line);position:relative;overflow:hidden;font-family:var(--mono);font-size:9px;color:var(--muted);display:grid;place-items:center}
.timeline span.done{background:#3a3f78;color:var(--ink)}
.timeline span.now{background:#2b2f62;color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.timeline span.now i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--gold) 35%,transparent)}
.timeline span b{position:relative;font-weight:500}

/* coach */
.coach{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--glow) 13%,var(--night2));border:1px solid color-mix(in srgb,var(--glow) 50%,transparent);
  border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:700}
.coach .no{font-family:var(--display);color:var(--glow);font-size:16px}
.coach span.t{flex:1;min-width:12em}
.coach button{border:1px solid var(--line);background:var(--night);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.coach button.ok{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

/* board */
.boardbox{width:100%;max-width:min(100%,80vh);margin:0 auto}
.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px;padding:8px;border-radius:14px;background:#171a39;border:1px solid var(--line);
  box-shadow:0 0 60px color-mix(in srgb,var(--glow) 12%,transparent)}
.cell{aspect-ratio:1;border:0;border-radius:7px;background:var(--lot);position:relative;padding:0;display:grid;place-items:center;
  color:var(--muted);transition:transform .12s ease}
.cell svg{width:56%;height:56%}
.cell.t{background:color-mix(in srgb,var(--c) 24%,var(--lot));color:var(--c);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 70%,transparent)}
.cell.lv2{box-shadow:inset 0 -3px 0 var(--c),0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.cell.lv3{background:color-mix(in srgb,var(--c) 40%,var(--lot));box-shadow:inset 0 -3px 0 var(--c),0 0 10px color-mix(in srgb,var(--c) 55%,transparent)}
.cell .v{position:absolute;right:3px;bottom:1px;font-family:var(--mono);font-size:clamp(8px,1.4vw,11px);color:var(--ink);line-height:1}
.cell .v.z{color:var(--down)}
.cell .st{position:absolute;right:3px;top:1px;font-size:clamp(7px,1.2vw,10px);color:var(--gold);line-height:1;letter-spacing:-1px}
.cell .lmk{position:absolute;left:3px;bottom:1px;font-size:clamp(7px,1.1vw,9px);color:var(--gold);line-height:1}
.cell.mine::after{content:"";position:absolute;left:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cell.hall{background:color-mix(in srgb,var(--gold) 18%,var(--lot));color:var(--gold)}
.cell.ruin{background:repeating-linear-gradient(45deg,#2a1d2c 0 4px,#221a33 4px 8px)}
.cell.ruin::before{content:"倒産";position:absolute;top:2px;left:0;right:0;text-align:center;font-size:clamp(7px,1.1vw,9px);color:var(--down);font-weight:800}
.cell.crumble{animation:shake .45s ease 3}
@keyframes shake{25%{transform:translateX(-2px) rotate(-4deg)}75%{transform:translateX(2px) rotate(4deg)}}
.cell.valid{background:#1b1f44;outline:1px dashed #3d4380;outline-offset:-3px}
.cell.valid.ruin{background:repeating-linear-gradient(45deg,#2a1d2c 0 4px,#1b1f44 4px 8px)}
.cell.valid .pv{font-family:var(--mono);font-size:clamp(9px,1.8vw,14px);font-weight:500}
.cell.valid .pv.p{color:var(--up)} .cell.valid .pv.n{color:var(--down)} .cell.valid .pv.zz{color:var(--muted)}
.cell.valid .pv.lmv{color:var(--gold)}
.cell.best{outline:2px solid var(--gold);outline-offset:-2px}
.cell.pick{outline:2px solid var(--ink);outline-offset:-2px;background:color-mix(in srgb,var(--c) 30%,var(--lot));color:var(--c)}
.cell.pick .v{color:var(--gold)}
.cell.insp{outline:2px solid var(--ink);outline-offset:-2px}
.cell.src{outline:1.5px solid color-mix(in srgb,var(--ink) 55%,transparent);outline-offset:-2px}
.cell .nb{position:absolute;left:2px;top:2px;font-family:var(--mono);font-size:clamp(8px,1.3vw,11px);padding:0 3px;border-radius:4px;background:rgba(8,10,30,.88);line-height:1.35;z-index:2}
.cell .nb.p{color:var(--up)} .cell .nb.n{color:var(--down)}
.cell.flash{animation:pop .6s ease}
.cell.risk::before{content:"";position:absolute;inset:2px;border-radius:6px;border:1.5px dashed var(--down);opacity:.8}
.cell.target{outline:2px dashed var(--down);outline-offset:-3px}
.cell.target.best{outline:2px solid var(--gold)}
.cell .bv{position:absolute;inset:auto 0 0 0;font-family:var(--mono);font-size:clamp(8px,1.5vw,12px);color:var(--ink);background:rgba(10,10,30,.75);border-radius:0 0 7px 7px;line-height:1.4}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.float{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--display);font-size:16px;color:var(--gold);pointer-events:none;
  text-shadow:0 2px 6px #000;animation:rise 1.4s ease forwards;white-space:nowrap;z-index:3}
.float.neg{color:var(--down)}
.float.pay{font-family:var(--mono);font-size:12px;animation-duration:1.2s}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-30px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:14px;height:14px}
.toggles{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.toggles label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}

/* type colors */
.k-en{--c:var(--i0)}.k-fi{--c:var(--i1)}.k-ma{--c:var(--i2)}.k-re{--c:var(--i3)}.k-tr{--c:var(--i4)}.k-me{--c:var(--i5)}
.k-ho{--c:var(--ho)}.k-in{--c:var(--sys)}.k-sc{--c:var(--sys)}.k-buy{--c:var(--down)}

/* side */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.panel h2 em{font-style:normal;color:var(--gold);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{font-family:var(--mono);font-weight:500}
.chip b.p{color:var(--up)} .chip b.n{color:var(--down)} .chip b.z{color:var(--muted)}
.next{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.next strong{color:var(--ink);font-family:var(--serif);font-size:14px}
.warn-line{margin-top:8px;font-size:12px;color:var(--down);font-weight:700}

/* market */
.mk{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:6px}
.mcard{border:1px solid var(--line);background:#191c3c;border-radius:10px;padding:8px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;position:relative}
.mcard .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.mcard .ic svg{width:20px;height:20px}
.mcard .nm{font-weight:800;font-size:12px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .tg{font-size:9px;color:var(--c);font-weight:800;letter-spacing:.04em}
.mcard.sys{background:linear-gradient(170deg,#2b2611,#191c3c 70%)}
.mcard.deck{border-style:dashed}
.mcard.deck::before{content:"山札";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:var(--rabbit);color:#2a0d18;border-radius:999px;padding:0 6px}
.mcard[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#191c3c);box-shadow:0 0 0 1px var(--c)}
.mcard:disabled{opacity:.45;cursor:not-allowed}
.cardrule{margin-top:10px;padding:9px 11px;border-radius:10px;background:#191c3c;font-size:12.5px;color:var(--muted);min-height:3.2em}
.cardrule b{color:var(--ink)}
.deckline{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.deckline .dk{display:inline-flex;align-items:center;gap:3px;padding:1px 7px 1px 4px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);font-weight:700}
.deckline .dk svg{width:12px;height:12px;color:var(--c)}

.pre{font-size:13px}
.pre .hint{color:var(--muted)}
.rows{display:grid;gap:4px;margin:8px 0 10px}
.rows div{display:flex;justify-content:space-between;gap:10px}
.rows span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rows .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:800}
.rows .tot span:last-child{font-family:var(--display);font-size:20px;color:var(--gold)}
.rows .sm{font-size:12px;color:var(--muted)}
.p{color:var(--up)} .n{color:var(--down)}
.go{width:100%;border:0;border-radius:10px;padding:11px;background:var(--gold);color:var(--gold-ink);font-weight:800;font-size:15px}
.go:disabled{opacity:.45;cursor:not-allowed}
.sub{font-size:11px;color:var(--muted);margin-top:6px}

.lms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.lm{border:1px dashed var(--line);border-radius:10px;padding:7px 9px;min-width:0}
.lm .ln{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.lm .ln small{font-family:var(--mono);color:var(--gold);font-weight:500}
.lm .lh{font-size:11px;color:var(--muted);line-height:1.45}
.lm.got{border-style:solid;border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:color-mix(in srgb,var(--gold) 9%,transparent)}
.lm.got .lh{color:var(--gold)}

.rank{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.rank li{display:grid;grid-template-columns:22px 22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 6px;border-radius:7px}
.rank li.me{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.rank .no{font-family:var(--mono);color:var(--muted);text-align:right}
.rank li:first-child .no{color:var(--gold)}
.rank .face{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--tc,var(--muted)) 24%,transparent)}
.rank .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank .who small{color:var(--muted);font-weight:500;margin-left:4px}
.rank .sc{font-family:var(--mono);font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;font-size:12px;display:grid;gap:3px;color:var(--muted)}
.log b{color:var(--ink)}
.log .ev{color:var(--gold)}
.empty{font-size:12px;color:var(--muted)}

details.rules summary{cursor:pointer;font-weight:800;font-size:13px}
details.rules ol{margin:8px 0 0;padding-left:1.3em;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
details.rules ol b{color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
.ghost.warn{border-color:var(--down);color:var(--down)}
.note{font-size:12px;color:var(--muted);background:#191c3c;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}

/* build bar: always at the bottom of the screen once a lot is chosen (PC and phone) */
.dock{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;gap:12px;align-items:center;
  width:min(480px,calc(100% - 24px));padding:10px 12px 10px 16px;background:rgba(20,22,48,.97);border:1px solid var(--gold);border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.55);backdrop-filter:blur(6px);animation:dockIn .25s ease}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,12px)}}
.dock .dt{flex:1;min-width:0;font-size:13px;font-weight:700}
.dock .dt b{font-family:var(--display);color:var(--gold);font-size:20px;margin-left:6px}
.dock .go{width:auto;padding:10px 20px}
.wrap{padding-block-end:96px}
/* PC: the side panel scrolls on its own, so the board stays in view */
@media (min-width:921px){
  .side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px;scrollbar-width:thin}
}

/* overlays */
.ov[hidden]{display:none}
.ov{position:fixed;inset:0;background:rgba(6,7,20,.7);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.paper{background:var(--paper);color:var(--paper-ink);width:min(470px,100%);border-radius:4px;padding:18px 20px 16px;box-shadow:0 30px 80px rgba(0,0,0,.5);
  transform:rotate(-1.2deg);animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:rotate(-8deg) scale(.6);opacity:0}}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--paper-ink);padding-bottom:4px;font-family:var(--serif);font-weight:800;gap:8px}
.paper .mast small{font-size:12px;font-weight:700;color:#6a5a3a}
.paper .mast span:last-child{background:var(--paper-red);color:var(--paper);padding:0 8px;font-size:13px}
.paper .yr{font-family:var(--serif);font-weight:800;font-size:44px;line-height:1;margin-top:12px;color:var(--paper-red)}
.paper .yr small{font-size:16px;margin-left:8px;color:var(--paper-ink)}
.paper h3{font-family:var(--serif);font-weight:800;font-size:28px;line-height:1.2;margin:4px 0 8px}
.paper p{font-family:var(--serif);font-weight:700;font-size:13.5px;line-height:1.7}
.paper .chips{margin:10px 0}
.paper .chip{color:var(--paper-ink);background:color-mix(in srgb,var(--c) 22%,transparent)}
.paper .chip b.p{color:#0f7a43}.paper .chip b.n{color:var(--paper-red)}.paper .chip b.z{color:#8a7a5a}
.paper .box{border:1px solid #cdbb8d;border-radius:3px;padding:8px 10px;margin-top:10px;font-family:var(--body);font-size:13px;font-weight:700;display:grid;gap:3px}
.paper .box .hd{font-family:var(--serif);font-weight:800;font-size:14px;border-bottom:1px solid #cdbb8d;padding-bottom:3px;margin-bottom:2px}
.paper .box b{color:var(--paper-red)}
.paper .box .g{color:#0f7a43}
.paper .btns{display:flex;gap:8px;margin-top:12px}
.paper .btns button{flex:1;border:0;background:var(--paper-ink);color:var(--paper);border-radius:6px;padding:9px;font-weight:800}

.sheet{background:var(--night2);border:1px solid var(--line);border-radius:18px;width:min(640px,100%);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:4px}
.sheet .lead{font-size:13px;color:var(--muted);margin-bottom:14px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.types{grid-template-columns:1fr}}
.type{--tc:var(--muted);text-align:left;border:1px solid var(--line);background:#191c3c;border-radius:14px;padding:12px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:start}
.type:hover{border-color:var(--tc)}
.type .face{grid-row:span 3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--tc) 22%,transparent)}
.type .tn{font-weight:800;font-size:15px;color:var(--tc)}
.type .ta{font-size:12.5px;color:var(--ink);line-height:1.5}
.ty-lion{--tc:var(--lion)}.ty-fox{--tc:var(--fox)}.ty-turtle{--tc:var(--turtle)}.ty-rabbit{--tc:var(--rabbit)}
.sheet .foot{margin-top:12px;font-size:12px;color:var(--muted)}
.dtabs{display:flex;gap:6px;margin-bottom:12px}
.dtabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;color:var(--muted)}
.dtabs button[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.quiz .qn{font-family:var(--mono);font-size:12px;color:var(--gold)}
.quiz .qt{font-weight:800;font-size:18px;margin:4px 0 12px;line-height:1.45}
.quiz .ans{display:grid;gap:8px}
.quiz .ans button{text-align:left;border:1px solid var(--line);background:#191c3c;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px}
.quiz .ans button:hover{border-color:var(--gold)}
.quiz .dots{display:flex;gap:5px;margin-top:12px}
.quiz .dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.quiz .dots i.on{background:var(--gold)}
.dres{text-align:center}
.dres .big{font-size:56px;line-height:1}
.dres .tn{font-family:var(--display);font-weight:400;font-size:24px;color:var(--tc);margin:6px 0}
.dres .lead2{font-size:13px;color:var(--muted);max-width:30em;margin:0 auto 10px}
.dres .abil{display:inline-block;text-align:left;background:#191c3c;border:1px solid var(--tc);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.dres .abil b{color:var(--tc)}
.dres .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.result .podium{display:grid;gap:6px;margin:12px 0}
.result .podium div{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:#191c3c}
.result .podium div.me{background:color-mix(in srgb,var(--gold) 16%,#191c3c);box-shadow:0 0 0 1px var(--gold)}
.result .podium .no{font-family:var(--display);color:var(--gold)}
.result .podium .face{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 24%,transparent)}
.result .podium .sc{font-family:var(--mono)}
.result .title{font-family:var(--serif);font-weight:800;font-size:26px;color:var(--gold);line-height:1.3}
.result .eras{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.result .eras td,.result .eras th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
.result .eras td:nth-child(n+3){text-align:right;font-family:var(--mono)}
.result .eras th{color:var(--muted);font-weight:700}
.result .tblwrap{max-height:260px;overflow:auto}
.result .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.result .btns button{flex:1;min-width:140px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:linear-gradient(90deg,#3a2c05,#5a4510);
  color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:10px 20px;font-weight:800;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  animation:toast 3.6s ease forwards;max-width:calc(100% - 32px);text-align:center}
.toast b{font-family:var(--display);font-weight:400;font-size:18px;color:#fff3c8;margin:0 6px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}

/* HUD: the three numbers that matter, always in one row */
.hud{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:10px;margin-bottom:8px}
.h-cell{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0;position:relative;overflow:hidden}
.h-cell .lab{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:800}
.h-cell b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums;position:relative}
.h-gdp .spark{position:absolute;left:0;right:0;bottom:0;height:30px;width:100%;opacity:.55}
.h-era .era{font-family:var(--serif);font-weight:800;font-size:18px;line-height:1.3}
.h-era .era b{font-family:var(--mono);font-weight:500;font-size:18px;color:var(--gold);margin-right:6px}
.settle{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700}
.settle i{width:12px;height:6px;border-radius:3px;background:var(--line)}
.settle i.on{background:var(--gold)}
.settle em{font-style:normal;margin-left:6px;color:var(--ink)}
.h-me{text-align:right}
.h-me .small{display:block;font-size:12px;color:var(--muted);font-weight:700}
@media (max-width:640px){.hud{grid-template-columns:1fr 1fr}.h-era{grid-column:1/-1;order:-1}.h-cell b{font-size:26px}}
.under{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.under label{margin-left:auto;display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* owner tag: colored corner = who owns it */
.cell .own{position:absolute;left:0;top:0;width:0;height:0;border-top:11px solid var(--oc);border-right:11px solid transparent;border-top-left-radius:7px}
.cell.mine::after{display:none}
.pdot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--oc);margin-right:4px;vertical-align:1px}

/* NEWS split into tailwind / headwind */
.wind{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;font-size:12px}
.wind .wl{font-weight:800;color:var(--up)} .wind .wl.dn{color:var(--down)} .wind .wl.zz{color:var(--muted)}
.more{margin-top:8px;font-size:12px;color:var(--muted)}
.more summary{cursor:pointer;font-weight:800;color:var(--ink)}
.more p{margin-top:6px}

/* tabs */
.tabsP{padding:0;overflow:hidden}
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.tabbar button{border:0;background:none;padding:10px 4px;font-size:12.5px;font-weight:800;color:var(--muted);border-bottom:2px solid transparent}
.tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabbar small{font-family:var(--mono);font-weight:500;color:var(--gold)}
.tabpane{padding:12px 14px 14px}
.tabnote{font-size:12px;color:var(--muted);margin-bottom:8px}
ol.rules{margin:0;padding-left:1.3em;font-size:12.5px;color:var(--muted);display:grid;gap:5px}
ol.rules b{color:var(--ink)}

/* neighbor ripple when something is built */
.cell.ripple{animation:ripple .7s ease}
@keyframes ripple{0%{box-shadow:0 0 0 0 var(--gold)}100%{box-shadow:0 0 0 8px transparent}}
.float.side{font-family:var(--mono);font-size:12px;top:2px}
.paper .tip{margin-top:8px;font-family:var(--body);font-size:12px;font-weight:700;background:#f1e2b6;border-radius:3px;padding:6px 9px}

/* rule as a picture formula */
.rch{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rch b{color:var(--ink);font-size:14px}
.rch small{font-size:10px;font-weight:800;color:var(--c);letter-spacing:.06em}
.rci{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.rci svg{width:17px;height:17px}
.fx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 5px;color:var(--ink);font-weight:800}
.fx .fb{font-family:var(--display);font-size:18px;color:var(--gold);min-width:16px;text-align:center}
.fx .op{color:var(--muted);font-size:14px}
.fx .ft{display:inline-flex;align-items:center;gap:4px;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:3px 7px 3px 4px}
.fx .ft b{font-family:var(--mono);font-weight:500;font-size:13px;color:var(--gold)}
.fx .ft.nw{font-size:11px;color:var(--muted);padding:3px 8px}
.fx .rg{width:15px;height:15px;flex:none}
.fc-ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 20%,transparent)}
.fc-ic svg{width:14px;height:14px}
.fc-ind{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--ink)}
.fc-ind i{width:6px;height:6px;border-radius:50%}
.fxn{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.pre .fx{margin-top:8px}

/* earnings forecast */
.fcst{display:flex;gap:6px;align-items:flex-end;margin:4px 0 10px;padding:6px 8px;background:#191c3c;border-radius:10px}
.fcc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fcc b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink)}
.fcc i{display:block;width:70%;max-width:26px;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--gold) 70%,transparent)}
.fcc.now i{background:var(--gold)}
.fcc.risk i{background:var(--down)} .fcc.risk b{color:var(--down)}
.fcc span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.pre .slab{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-top:4px}

/* notebook */
.book{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:60vh;overflow:auto}
@media (max-width:520px){.book{grid-template-columns:1fr}}
.badge{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
.badge .bm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--night);color:var(--muted);font-weight:800}
.badge b{display:block}
.badge small{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.badge.got{border-style:solid;border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:color-mix(in srgb,var(--gold) 8%,transparent)}
.badge.got .bm{background:var(--gold);color:var(--gold-ink)}
.newbadge{margin-top:12px;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 50%,transparent)}
.nb2{display:inline-block;margin:2px 6px 2px 0;font-weight:800;color:var(--gold)}
.sheet .btns{display:flex;gap:8px;flex-wrap:wrap}

/* era mission */
.quest{margin-top:10px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);background:color-mix(in srgb,var(--glow) 9%,transparent);border-radius:10px;padding:8px 10px;font-size:12.5px}
.quest .qh{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;color:var(--glow);letter-spacing:.06em}
.quest .qb{font-weight:800;color:var(--ink);margin-top:2px}
.quest.got{opacity:.75;border-style:dashed}
.cell.valid .pv.mqv{color:var(--glow)}

/* turn banner (pass-and-play) */
.turn{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 12px;border-radius:12px;background:var(--night2);border:1px solid var(--line);font-weight:800}
.turn .face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--tc) 26%,transparent)}
.turn .ord{margin-left:auto;display:flex;gap:4px}
.turn .ord i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:color-mix(in srgb,var(--tc) 18%,transparent);opacity:.5}
.turn .ord i.on{opacity:1;box-shadow:0 0 0 2px var(--gold)}
.turn small{color:var(--muted);font-weight:600}

/* setup */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#191c3c;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 14%,#191c3c)}
.seg button small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.slab{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:4px 0 6px}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#191c3c;margin-bottom:8px}
.prow .pn{font-family:var(--display);color:var(--gold);font-size:15px;text-align:center}
.prow input{width:100%;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font:inherit;font-weight:700}
.prow .tys{grid-column:2;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.prow .tys button{border:1px solid var(--line);background:var(--night);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--muted)}
.prow .tys button[aria-pressed="true"]{border-color:var(--tc);color:var(--ink);background:color-mix(in srgb,var(--tc) 22%,var(--night))}
.prow .tys .dg{border-style:dashed}
.cpurow{font-size:12px;color:var(--muted);margin:2px 0 10px}
.daily{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.daily ol{margin:6px 0 0;padding-left:1.4em;font-size:13px;display:grid;gap:2px}
.daily li.me{color:var(--gold);font-weight:800}

#typebg,#bookbg,#polbg{z-index:30}
.pol h3{font-family:var(--serif);font-weight:800;font-size:21px;margin:2px 0 6px}
.polcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.polcards{grid-template-columns:1fr}}
.polcard{text-align:left;border:1px solid var(--line);background:#191c3c;border-radius:14px;padding:14px;display:grid;gap:6px}
.polcard:hover,.polcard:focus-visible{border-color:var(--glow);background:color-mix(in srgb,var(--glow) 10%,#191c3c)}
.polcard .pn{font-family:var(--display);font-size:20px;color:var(--glow)}
.polcard .pd{font-size:12.5px;color:var(--muted)}
.polcard .pe{display:flex;flex-wrap:wrap;gap:5px}
.polcard .pm{font-size:12px;color:var(--muted)} .polcard .pm b{color:var(--gold);font-family:var(--mono);font-weight:500}
.polnow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:10px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--glow) 12%,transparent);font-size:12px}
.polnow span{color:var(--glow);font-weight:800}.polnow b{font-size:14px}.polnow small{color:var(--muted)}
.bk-body .chip{color:var(--paper-ink);background:color-mix(in srgb,var(--c) 22%,transparent)}
.bk-body .chip b.p{color:#0f7a43}.bk-body .chip b.n{color:var(--paper-red)}
.bk-body .wind .wl{color:#0f7a43}.bk-body .wind .wl.dn{color:var(--paper-red)}
.bk-body ol.three li{background:#f1e2b6}.bk-body ol.three span{color:#5a4a2a}
/* phone: keep the board near the top, the market right under it */
@media (max-width:640px){
  .wrap{padding-block-start:10px}
  .top{gap:8px;margin-bottom:10px}
  .brand svg{width:24px;height:24px}
  .brand .h1{font-size:19px}
  .brand .sub2{display:none}
  .tabs button{padding:5px 10px;font-size:12px}
  .me-chip{font-size:11px;padding:3px 10px 3px 4px}
  .icon-btn{padding:4px 9px}
  .hud{gap:6px}
  .h-cell{padding:7px 10px;border-radius:12px}
  .h-cell b{font-size:22px}
  .h-era .era{font-size:15px}
  .h-gdp .spark{display:none}
  .timeline{display:none}
  .side>.tabsP{order:4}
  .side>.tools{order:5}
}

/* town look: the gaps between lots are streets, buildings sit up off the ground */
.board{gap:4px;background:#2b2f5e;background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.035) 6px 9px)}
.cell{background:#1d2148}
.cell.t{background-image:linear-gradient(180deg,rgba(255,255,255,.13),transparent 48%);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 70%,transparent),0 3px 0 rgba(0,0,0,.4)}
.cell.t svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.cell.lv2{box-shadow:inset 0 -3px 0 var(--c),0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 4px 0 rgba(0,0,0,.45)}
.cell.lv3{box-shadow:inset 0 -3px 0 var(--c),0 0 12px color-mix(in srgb,var(--c) 60%,transparent),0 5px 0 rgba(0,0,0,.5)}
.k-river{--c:#4aa3ff}.k-sta{--c:#d9dcf2}
.cell.terr.k-river{background:linear-gradient(135deg,#1c4f8f,#2a6bb5 55%,#1c4f8f);color:#9fd0ff}
.cell.terr.k-river svg{width:70%;height:70%;opacity:.8;animation:flow 3s ease-in-out infinite}
@keyframes flow{50%{transform:translateX(2px)}}
.cell.terr.k-sta{background:linear-gradient(180deg,#e9ebfa,#b9bde0);color:#2a2f5e;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.cell.hall{box-shadow:0 0 14px color-mix(in srgb,var(--gold) 40%,transparent),0 3px 0 rgba(0,0,0,.4)}

/* your-turn panel: steps → market → preview, all in one place */
.turnP{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 12%,transparent),0 10px 30px rgba(0,0,0,.25)}
.turnP[data-wait="1"]{border-color:var(--line);box-shadow:none}
.stepbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:4px;flex:1;min-width:0;counter-reset:s;position:relative}
.steps li{counter-increment:s;flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--muted);padding:6px 6px;border-radius:9px;background:#191c3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li::before{content:counter(s);flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:11px;background:var(--line);color:var(--ink)}
.steps li.now{background:color-mix(in srgb,var(--gold) 18%,#191c3c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.steps li.now::before{background:var(--gold);color:var(--gold-ink)}

  {y:1964,w:'昭和39年',age:'showa',n:'東京オリンピック',d:'東海道新幹線や首都高速が開通し、建設と輸送が活気づく。中継を見るためテレビも売れた。',r:[2,1,3,1,3,1]},

function simulateBuy(g,r,c,era,ty,st){

// 置いたときの内訳：自分の稼ぎ、まわりの建物の増減（位置つき）、完成する名所、時代のお題
function simulate(g,r,c,k,era,ty,st){

/* 市場：シードつきの山札から5枚。とった分を補充し、時代が変わると総入れ替え */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function replay(tiles,seed,onStep){
  POLMAP={};
  const g=grid0(seed), own={}, log=[], hist=[0], eras=[], claimed={}, mq={}, D=deck(seed); let n=0, ruins=[], di=0, mk=[];
  const refill=()=>{mk=[];for(let j=0;j<MKT;j++)mk.push(D(di++))};
  refill();
  const O=(k,nick,ty)=>{const o=own[k]||(own[k]={key:k,nick:'',ty:'',score:0,build:0,settle:0,built:0,bust:0,grow:0,buys:0,lm:0,mq:0,kinds:{}});if(nick)o.nick=nick;if(ty)o.ty=ty;return o};
  const quest=(e,r,c,k,isBuy,t,o)=>{if(mq[e]||!missionHit(e,g,r,c,k,out(g,r,c,e),isBuy))return;mq[e]={ok:t.ok,nick:t.nick,n};o.score+=mqPts(t.ty);o.mq++;log.push({type:'q',e,nick:t.nick,ok:t.ok,n})};
  for(const t of tiles){
    if(n>=ERA*ERAS*9) break;
    if(t.k==='pol'){const e0=Math.floor(n/ERA);if(n>0&&n%ERA===0&&t.e===e0&&!POLMAP[e0]&&POLBY[t.p]&&polOffer(seed,e0).some(p=>p.id===t.p)){POLMAP[e0]=t.p;log.push({type:'p',p:t.p,nick:t.nick,ok:t.ok,e:e0,n})}continue}
    if(!inb(t.r,t.c)||!T[t.k]) continue;
    // 市場（またはウサギの山札）にそのカードがあるか
    let slot=-1, fromDeck=false;
    if(t.src==='d'&&t.ty==='rabbit'&&D(di)===t.k) fromDeck=true; else slot=mk.indexOf(t.k);
    if(!fromDeck&&slot<0) continue;
    const e=Math.floor(n/ERA), before=gdp(g,e);
    if(t.k==='buy'){
      if(!buyable(g,t.r,t.c,e,t.ok)) continue;
      const x=g[t.r][t.c], from=x.nick;
      x.ok=t.ok; x.nick=t.nick; x.ty=t.ty;
      const sc=lionx(t.ty,gdp(g,e)-before), o=O(t.ok,t.nick,t.ty);
      o.score+=sc; o.build+=sc; o.buys++;
      log.push({type:'m',nick:t.nick,k:x.k,from,d:sc,ok:t.ok,n,name:x.name});
      quest(e,t.r,t.c,x.k,true,t,o);
    }else{
      if(!valid(g,t.r,t.c)) continue;
      g[t.r][t.c]={k:t.k,ok:t.ok,nick:t.nick,ty:t.ty,lv:1,name:cname(seed,n,t.k)};
      const sc=lionx(t.ty,gdp(g,e)-before), o=O(t.ok,t.nick,t.ty);
      o.score+=sc; o.build+=sc; o.built++; o.kinds[t.k]=(o.kinds[t.k]||0)+1;
      log.push({type:'b',nick:t.nick,k:t.k,d:sc,ok:t.ok,n,name:g[t.r][t.c].name});
      for(const id of newLms(g,t.r,t.c,claimed)){
        claimed[id]={ok:t.ok,nick:t.nick,n,r:t.r,c:t.c}; o.score+=LMBONUS; o.lm++;
        log.push({type:'l',id,nick:t.nick,ok:t.ok,n});
      }
      quest(e,t.r,t.c,t.k,false,t,o);
      ruins=ruins.filter(([r,c])=>!(r===t.r&&c===t.c));
    }
    if(fromDeck) di++; else {mk.splice(slot,1);mk.push(D(di++))}
    n++;
    if(n%ERA===0){
      const rep={e,y:H(e).y,gdp:gdp(g,e),bust:[],grow:[],pay:{},cells:[],ind:{}};
      const vals=[];
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=g[r][c];if(x&&x.ok!=null){const v=out(g,r,c,e);vals.push([r,c,v]);const oo=O(x.ok);if(isInd(x.k))rep.ind[x.ok]=(rep.ind[x.ok]||0)+1;oo.score+=v;oo.settle+=v;rep.pay[x.ok]=(rep.pay[x.ok]||0)+v}}
      ruins=[];
      for(const[r,c,v]of vals){const x=g[r][c];
        if(v<=BUST&&canBust(x)){rep.bust.push({k:x.k,ok:x.ok,nick:x.nick,name:x.name});O(x.ok).bust++;g[r][c]=null;ruins.push([r,c]);rep.cells.push([r,c,v,'bust'])}

      hist.push(rep.gdp); eras.push(rep);
      log.push({type:'e',rep});
      refill();
      if(onStep) onStep(g,n,e,true);

  }
  return {g,own,log,hist,eras,n,ruins,claimed,mq,market:mk,peek:[D(di),D(di+1),D(di+2)]};
}

function forecast(g,r,c,k,e,ty){
  let tmp=false; if(k&&!g[r][c]){g[r][c]={k,ty,lv:1};tmp=true}
  const t=g[r][c], last=S.mode==='local'?NE()-1:e+3, a=[];
  for(let x=e;x<=Math.min(e+3,last);x++){const v=out(g,r,c,x);a.push({y:H(x).y,v,risk:x>e&&canBust(t)&&v<=BUST})}
  if(tmp) g[r][c]=null;
  return a;
}

function checkBadges(){
  if(S.mode!=="local"||!S.game||S.game.badged) return [];
  if(S.game.chal){S.game.badged=true;S.game.fresh=[];saveGame();return []}
  const R=S.R, arr=Object.values(R.own).sort((a,b)=>b.score-a.score), got=store.get('azakei-city-badges')||{}, wins=store.get('azakei-city-wins')||{};
  const today=todayStr(), fresh=[], hs=humans(), finalGdp=R.hist.at(-1)||0;
  const unlock=id=>{if(!got[id]){got[id]=today;fresh.push(id)}};
  for(const p of hs){
    const o=R.own[p.key]; if(!o) continue;
    const rank=arr.indexOf(o);
    unlock('first');
    if(rank===0){unlock('win');wins[p.ty]=(wins[p.ty]||0)+1;if(S.game.short)unlock('short')}
    if(finalGdp>=(S.game.short?300:600)) unlock('city');
    if(o.lm>=3) unlock('lm3');
    if(o.mq>=4) unlock('mq4');
    const indBuilt=Object.entries(o.kinds).reduce((s,[k,v])=>s+(isInd(k)?v:0),0);
    if(p.ty!=='turtle'&&o.bust===0&&indBuilt>=8) unlock('nobust');
    const lr=R.eras.find(x=>HI(x.e)===7); if(lr&&p.ty!=='turtle'&&(lr.ind[p.key]||0)>=4&&!lr.bust.some(b=>b.ok===p.key)) unlock('lehman');
    if(o.buys>=3) unlock('buy3');
    if(R.g.some(row=>row.some(x=>x&&x.ok===p.key&&(x.lv||1)>=3))) unlock('lv3');
    if(['ho','en','fi','ma','re','tr','me','in','sc'].every(k=>o.kinds[k])) unlock('all9');
    if(R.log.some(x=>x.ok===p.key&&(x.type==='b'||x.type==='m')&&x.d>=30)) unlock('big');
    if(!S.game.short&&o.score>=1500) unlock('score');
    if(S.game.daily) unlock('daily');
    if(hs.length>1) unlock('friends');
  }
  if(TYK.every(t=>wins[t])) unlock('types');
  store.set('azakei-city-badges',got); store.set('azakei-city-wins',wins);
  S.game.badged=true; S.game.fresh=fresh; saveGame();
  return fresh;
}

function spark(vals){
  const w=600,h=36,mx=Math.max(4,...vals),n=Math.max(2,vals.length);
  const x=i=>i*(w-6)/(n-1)+3, y=v=>h-3-(v/mx)*(h-8);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  $('spark').innerHTML=vals.length<2?'':`<polyline points="${x(0)},${h} ${pts} ${x(vals.length-1)},${h}" fill="rgba(255,200,58,.12)" stroke="none"/><polyline points="${pts}" fill="none" stroke="#ffc83a" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="3" fill="#ffc83a"/>`;
}

function settleFx(rep){
  if(!rep) return;
  S.pause=true;
  const board=$('board'), wait=reduced()?0:1500;
  if(!reduced()){
    let i=0;
    for(const[r,c,v,f]of rep.cells){
      const el=board.querySelector(`[data-r="${r}"][data-c="${c}"]`); if(!el) continue;
      if(f==='bust'){el.classList.add('crumble');continue}
      if(v<=0) continue;
      const d=i++*14;
      setTimeout(()=>{const s=document.createElement('span');s.className='float pay';s.textContent='+'+v;el.appendChild(s);if(d<500)sfx.coin(i)},d);
      if(f==='grow') el.classList.add('flash');
    }
  }
  setTimeout(showPaper,wait);
}

function titleFor(o,rank){

  if(o.lm>=3) return '名所プロデューサー';
  if(o.mq>=4) return '時代を読む社長';
  if(o.buys>=3) return '買収王';
  if(o.bust>=3) return '七転び八起きの社長';

async function dailyBoard(date,me){

  if(best.date!==date||me.score>best.score) store.set('azakei-city-daily-best',{date,score:me.score});

  try{

/* ---------- 政策会議 ---------- */
function needPolicy(){
  if(S.mode!=='local'||!S.game) return false;
  syncEL();
  const R=replay(S.game.tiles,S.game.seed), e=Math.floor(R.n/ERA);
  return R.n>0&&R.n%ERA===0&&R.n<ERA*NE()&&!POLMAP[e];
}
function startPolicy(){
  syncEL();
  const R=replay(S.game.tiles,S.game.seed), e=Math.floor(R.n/ERA), offers=polOffer(S.game.seed,e);
  // いちばん下位の社長が決める（同点なら手番の早い順）
  const P=S.game.players, sc=p=>(R.own[p.key]||{score:0}).score;
  const chooser=P.slice().sort((a,b)=>sc(a)-sc(b))[0];
  const commit=id=>{
    S.game.tiles.push({k:'pol',p:id,e,ok:chooser.key,nick:chooser.nick,t:Date.now()});
    saveGame(); S.policy=false; $('polbg').hidden=true;
    toast(`政策決定！<b>${POLBY[id].name}</b>${esc(sh(chooser.nick))}が決めました`); sfx.turn();
    render(); setTimeout(advance,reduced()?100:500);
  };
  S.policy=true;
  if(chooser.cpu){
    // CPU：自分の建物がいちばん得をする政策を選ぶ
    const gain=p=>{let s=0;for(const row of R.g)for(const x of row)if(x&&p.b[x.k])s+=(x.ok===chooser.key?1:-.4)*p.b[x.k];return s};
    const pick=offers.slice().sort((a,b)=>gain(b)-gain(a))[0];
    setTimeout(()=>commit(pick.id),reduced()?100:700);
    return;
  }
  S.viewer=chooser.key;

function cpuStep(){
  syncEL();
  if(S.mode!=='local'||!S.game) return;
  if(S.pause||S.policy){setTimeout(cpuStep,300);return}
  if(needPolicy()){advance();return}
  const tp=turnPlayer(); if(!tp.cpu){advance();return}
  const R=replay(S.game.tiles,S.game.seed), best=cpuPick(R,tp.ty,tp.key,S.game.cpu);
  S.game.tiles.push(best?{r:best.r,c:best.c,k:best.k,src:best.src,t:Date.now(),ok:tp.key,nick:tp.nick,ty:tp.ty}:{k:'pass',t:Date.now(),ok:tp.key});
  saveGame();
  render(); if(best){floatAt(best.r,best.c,best.d);rippleAt(best.ch);cpuTalk(tp,best)}
  setTimeout(advance,reduced()?150:500);
}
async function place(){
  const card=selCard();
  if(!S.cell||!card||locked()) return;
  const[r,c]=S.cell, k=card.k, ty=myTy(), src=card.src==='d'?'d':'m';
  const sim=k==='buy'?simulateBuy(S.R.g,r,c,eraNow(),ty,S.R):simulate(S.R.g,r,c,k,eraNow(),ty,S.R), d=sim.score, ch=sim.changes||[];
  if(k==='buy') tone(140,.3,'square',.05);
  if(S.tut===2){S.tut=3}
  if(S.mode==='local'){
    const p=viewerP();
    S.game.tiles.push({r,c,k,src,t:Date.now(),ok:p.key,nick:p.nick,ty:p.ty});
    saveGame();
    afterPlace(r,c,d,ch);
    advance();
    return;
  }
  const nick=(S.nick||'').trim();
  if(!nick){$('nick').focus();$('nick').placeholder='社長名を入れてね';return}
  S.busy=true; render();
  try{
    const doc={r,c,k,src,t:Date.now(),ok:NET.uid||('n:'+nick),nick,ty};
    const ref=await NET.db.collection('cells').add(doc);
    NET.err='';
    if(!S.sharedTiles.some(x=>x.id===ref.id)){S.sharedTiles.push({id:ref.id,...doc});sortShared()}
    S.busy=false; afterPlace(r,c,d,ch);
  }catch(err){
    S.busy=false; S.cell=null;
    NET.err=err&&err.code==='invalid_argument'?'この街に建てる権限がありません。閲覧のみになります。':err&&err.code==='quota_exceeded'?'街のデータがいっぱいです。オーナーにリセットを頼んでください。':'建てられませんでした。少し待ってからもう一度どうぞ。';
    if(err&&err.code==='invalid_argument') NET.canWrite=false;
    render();
  }
}

const CPULV={hint:{fut:.9,risk:3,noise:0,top:1},easy:{fut:0,risk:0,noise:7,top:5},normal:{fut:.4,risk:1,noise:5,top:1},hard:{fut:.9,risk:3,noise:0,top:1}};
function cpuPick(R,ty,ok,lvName){
  const L=CPULV[lvName||'normal']||CPULV.normal, g=R.g, cells=validCells(g), e=Math.floor(R.n/ERA), cand=[];
  for(const x of choices(R,ty)){
    if(x.k==='buy'){
      for(const[r,c]of buyTargets(g,e,ok)){const s=simulateBuy(g,r,c,e,ty,R);cand.push({v:s.score+(L.fut+.9)*s.fut-(ty!=='turtle'&&s.fut<=BUST?L.risk*2:0)+Math.random()*L.noise,r,c,k:x.k,src:x.src,d:s.score,ch:[],lms:[],mq:s.mq})}
      continue;
    }
    for(const[r,c]of cells){
      const s=simulate(g,r,c,x.k,e,ty,R);
      cand.push({v:s.score+L.fut*s.fut-(isInd(x.k)&&ty!=='turtle'&&s.fut<=BUST?L.risk:0)+Math.random()*L.noise,r,c,k:x.k,src:x.src,d:s.score,ch:s.changes,lms:s.lms,mq:s.mq});
    }
  }
  if(!cand.length) return null;
  cand.sort((a,b)=>b.v-a.v);
  return cand[Math.floor(Math.random()*Math.min(L.top,cand.length))];
}

// 'ho' 建物 / 'ho:3' 稼ぎつき / 'ho:3:+1' 増減つき / '?+4' 建てられるマス（*で一番お得）/ 'x' 倒産跡 / 'hall' 役所 / '' 空き地
function mini(rows){
  const n=rows[0].length;
  return `<div class="mini" style="--n:${n}" aria-hidden="true">${rows.flat().map(s=>{
    if(!s) return '<span class="cell"></span>';
    if(s==='x') return '<span class="cell ruin"></span>';
    if(s==='hall') return `<span class="cell hall">${ic('hall')}</span>`;
    if(s==='river'||s==='sta') return `<span class="cell terr k-${s}">${ic(s)}</span>`;
    if(s[0]==='?'){const best=s.endsWith('*'),v=s.slice(1).replace('*','');return `<span class="cell valid${best?' best':''}"><span class="pv ${v.startsWith('-')?'n':'p'}">${v}</span></span>`}
    const[k,v,tag]=s.split(':'), lv=k.endsWith('2')?2:1, kk=k.replace('2','');
    return `<span class="cell t k-${kk}${lv>1?' lv2':''}">${ic(kk)}${lv>1?'<span class="st">★</span>':''}${v!=null&&v!==''?`<span class="v${v==='0'?' z':''}">${v}</span>`:''}${tag?`<span class="tagx${tag.startsWith('-')?' n':''}">${tag}</span>`:''}</span>`;
  }).join('')}</div>`;
}

    <div class="bk-grid">
      <div class="bk-box" style="margin:0"><b>ひとりで</b><br>CPUの社長2人と対戦。</div>
      <div class="bk-box" style="margin:0"><b>友だちと</b><br>1台を順番に回して2〜4人。</div>
      <div class="bk-box" style="margin:0"><b>今日の街</b><br>その日はみんな同じ市場。点数で勝負。</div>
      <div class="bk-box" style="margin:0"><b>ショート</b><br>大事件の6時代だけ。短く遊べる。</div>
    </div>`}
];
let bookPage=0;
function showRulebook(p){bookPage=Math.max(0,Math.min(BOOK.length-1,p||0));drawBook();$('bookbg').hidden=false;$('bookbg').querySelector('.bk-next').focus()}
function drawBook(){
  const pg=BOOK[bookPage];
  $('bookbg').innerHTML=`<div class="book2" role="dialog" aria-label="ルールブック">
    <div class="bk-head"><b>AZAKEI CITY</b><span>ルールブック</span><button type="button" data-bk="close">とじる</button></div>
    <div class="bk-body"><div class="bk-no">${String(bookPage+1).padStart(2,'0')} / ${String(BOOK.length).padStart(2,'0')}</div><h3>${pg.t}</h3>${pg.h()}</div>
    <div class="bk-foot"><button type="button" data-bk="prev"${bookPage?'':' disabled'}>← まえ</button>
      <span class="bk-dots">${BOOK.map((_,i)=>`<i class="${i===bookPage?'on':''}" data-bk="go" data-p="${i}" title="${BOOK[i].t}"></i>`).join('')}</span>
      <button type="button" class="bk-next" data-bk="${bookPage<BOOK.length-1?'next':'close'}">${bookPage<BOOK.length-1?'つぎへ →':'遊んでみる'}</button></div></div>`;
}
$('bookbg').addEventListener('click',e=>{
  const b=e.target.closest('[data-bk]');
  if(!b){if(e.target.id==='bookbg')$('bookbg').hidden=true;return}
  const a=b.dataset.bk;
  if(a==='close'){$('bookbg').hidden=true;store.set('azakei-city-readbook',1);return}
  bookPage=a==='prev'?bookPage-1:a==='next'?bookPage+1:+b.dataset.p;
  drawBook(); $('bookbg').querySelector('.bk-body').scrollTop=0; sfx.pick();
});
document.addEventListener('keydown',e=>{
  if($('bookbg').hidden) return;
  if(e.key==='ArrowRight'&&bookPage<BOOK.length-1){bookPage++;drawBook()}
  else if(e.key==='ArrowLeft'&&bookPage>0){bookPage--;drawBook()}
  else if(e.key==='Escape') $('bookbg').hidden=true;
});
$('openBook2').onclick=()=>showRulebook(0);

/* ---------- チャレンジ（歴史シナリオ・ひとりで★を集める） ---------- */
// star：最後の街のGDPの目標（★1 / ★2 / ★3）
const CHAL=[
  {id:'c1',name:'東京オリンピック',yr:'1964',eras:[0],star:[37,47,60],d:'新幹線と首都高の時代。8手で、街の土台をつくれ。',hint:'運輸と製造が追い風。運輸を2つ並べると、時代のお題も達成。'},
  {id:'c2',name:'オイルショックを乗り切れ',yr:'1964→1973',eras:[0,1],star:[70,87,94],d:'高度成長から、突然の石油危機へ。',hint:'1973年は運輸−3・製造−2。エネルギーに乗り換えるか、保険で守ろう。'},
  {id:'c3',name:'バブルの宴と崩壊',yr:'1988→1991',eras:[3,4],star:[65,79,88],d:'株と土地が急上昇。そして、はじける。',hint:'1988年は金融とメディアが+3。でも1991年、金融は−3。'},
  {id:'c4',name:'ネットの時代',yr:'1995→2008',eras:[5,6,7],star:[82,96,112],d:'インターネット元年からITバブル、そしてリーマン・ショック。',hint:'メディアと製造で稼ぎ、2008年の暴落の前に保険を。'},
  {id:'c5',name:'令和の街',yr:'2013→2022',eras:[9,10,11],star:[108,140,160],d:'訪日客、巣ごもり、資源高。変化の激しい10年。',hint:'2020年は運輸−3。小売とメディアが+3。2022年はエネルギーと製造。'}
];
const chalBest=()=>store.get('azakei-city-chal')||{};
const starsOf=(c,gdp)=>c.star.filter(s=>gdp>=s).length;
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function showChallenges(){
  const best=chalBest(), ty=store.get('azakei-city-ty-local')||'fox';
  const total=CHAL.reduce((s,c)=>s+(best[c.id]||0),0);
  $('typebg').innerHTML=`<div class="sheet" role="dialog" aria-label="チャレンジ">
    <h3>チャレンジ</h3><p class="lead">歴史の一場面を、ひとりで攻略。最後の街のGDPで★がつきます。決算のあとの政策も、あなたが決めます。いまの★ ${total} / ${CHAL.length*3}</p>
    <div class="slab">社長タイプ</div>
    <div class="seg" id="chTy">${TYK.map(k=>`<button type="button" data-cty="${k}" aria-pressed="${ty===k}">${TY[k].face} ${TY[k].name}</button>`).join('')}</div>
    <div class="chl">${CHAL.map((c,i)=>{const b=best[c.id]||0,open=i===0||(best[CHAL[i-1].id]||0)>=1;
      return `<button type="button" class="chc${b?' done':''}" data-chal="${c.id}"${open?'':' disabled'}><span class="cy">${c.yr}</span><b>${i+1}. ${c.name}</b><span class="cd">${open?c.d:'ひとつ前のチャレンジで★1をとると挑戦できます'}</span><span class="cs">${starStr(b)}</span><span class="cg">目標GDP ${c.star.join(' / ')}</span></button>`}).join('')}</div>
    <div class="btns" style="margin-top:12px"><button class="ghost" type="button" data-close="1">とじる</button></div></div>`;
  $('typebg').hidden=false;
  $('typebg').querySelector('.chc:not(:disabled)').focus();
}
function startChallenge(id){
  const c=CHAL.find(x=>x.id===id); if(!c) return;
  const ty=store.get('azakei-city-ty-local')||'fox';
  S.game={seed:Math.floor(Math.random()*1e9),chal:id,eras:c.eras.slice(),players:[{key:'h1',nick:(S.nick||'').trim()||'あなた',ty,cpu:false}],tiles:[]};
  saveGame(); S.seen.local=-1; S.sel=S.cell=S.insp=null; S.pause=false; S.busy=false; S.policy=false; S.viewer='h1';
  $('typebg').hidden=true; hideHome();
  if(S.mode!=='local') setMode('local'); else render();
  toast(`チャレンジ開始！<b>${c.name}</b>目標GDP ${c.star[0]}`);
  advance();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cty]'); if(t){store.set('azakei-city-ty-local',t.dataset.cty);showChallenges();sfx.pick();return}
  const c=e.target.closest('[data-chal]'); if(c&&!c.disabled){sfx.pick();$('resultbg').hidden=true;startChallenge(c.dataset.chal);return}
  if(e.target.closest('#toChal')){$('resultbg').hidden=true;showChallenges()}
});
// 結果画面に出すチャレンジの評価
function chalResultHTML(){
  if(S.mode!=='local'||!S.game||!S.game.chal) return '';
  const c=CHAL.find(x=>x.id===S.game.chal), gdp=S.R.hist.at(-1)||0, n=starsOf(c,gdp), best=chalBest();
  if(!S.game.chalSaved){if(n>(best[c.id]||0)){best[c.id]=n;store.set('azakei-city-chal',best)}S.game.chalSaved=true;saveGame()}
  const i=CHAL.indexOf(c), next=CHAL[i+1];
  return `<div class="chres"><div class="slab">チャレンジ「${c.name}」</div><div class="big">${starStr(n)}</div>
    <p>最後の街のGDP <b>${gdp}</b>　（目標 ${c.star.map((s,j)=>`<span class="${gdp>=s?'ok':''}">★${j+1} ${s}</span>`).join('・')}）</p>
    <div class="btns"><button class="go" type="button" data-chal="${c.id}">もう一度</button>${next&&n>=1?`<button class="ghost" type="button" data-chal="${next.id}">次のチャレンジへ</button>`:''}<button class="ghost" type="button" id="toChal">チャレンジ一覧</button></div></div>`;
}

/* ---------- ホーム画面 ---------- */
function showHome(){
  S.homeOpen=true;
  let cont='';
  if(S.game&&S.game.tiles.length){
    const keep=S.mode; S.mode='local'; syncEL();
    const R=replay(S.game.tiles,S.game.seed), e=Math.floor(R.n/ERA);
    if(R.n<ERA*NE()){const ev=H(e);cont=`<button class="cont" type="button" data-h="cont"><span class="big">つづきから</span><span>${ev.y}年代「${esc(ev.n)}」・${R.n}手目<small>${S.game.players.filter(p=>!p.cpu).map(p=>`${TY[p.ty].face} ${esc(p.nick)}`).join('・')}${S.game.daily?' ・ 今日の街':''}${S.game.short?' ・ ショート':''}</small></span><span class="arrow">→</span></button>`}
    S.mode=keep; syncEL();
  }
  const sky=[]; const pat='ho en ma tr re ho fi me ho sc in re ho ma en ho re tr me fi ho ma ho re in sc'.split(' ');
  for(let i=0;i<26;i++){const k=pat[i];sky.push(i%7===3&&i>13?'<span class="empty" style="animation-delay:'+(i*60)+'ms"></span>':`<span class="k-${k}" style="animation-delay:${i*60}ms">${ic(k)}</span>`)}
  const first=!store.get('azakei-city-readbook');
  $('home').innerHTML=`<div class="home-in">
    <div class="hero">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 21 17H3Z"/><path d="M12 22 3 7h18Z"/></svg>
      <div class="logo">AZAKEI CITY</div>
      <div class="tag">1964→2022。60年の経済を、街ごと生き抜け。</div>
      <p class="tag2">建物を建てて、となりどうしで稼ぎを増やす。オイルショックもバブルもリーマン・ショックも、街ごと乗りこえろ。</p>
      <div class="skyline" aria-hidden="true">${sky.join('')}</div>
      <div class="years">${HIST.map((h,i)=>i%2===0?`<span><b>${h.y}</b> ${esc(h.n)}</span>`:'').join('')}</div>
    </div>
    ${cont}
    <div class="menu${HASCLAUDE?"":" n6"}">
      <button class="mbtn main" type="button" data-h="new"><span class="mi">🏙️</span><b>新しい街をつくる</b><small>ひとりでCPUと／友だちと2〜4人で</small></button>
      <button class="mbtn" type="button" data-h="short"><span class="mi">⏱️</span><b>ショートで遊ぶ</b><small>大事件の6時代だけ。サクッと1ゲーム</small></button>
      <button class="mbtn" type="button" data-h="chal"><span class="mi">🏆</span><b>チャレンジ</b><small>歴史の一場面をひとりで攻略。★を集めよう（★${CHAL.reduce((s,c)=>s+(chalBest()[c.id]||0),0)}/${CHAL.length*3}）</small></button>
      <button class="mbtn" type="button" data-h="daily"><span class="mi">📅</span><b>今日の街</b><small>今日はみんな同じ市場。点数で勝負</small></button>
      <button class="mbtn${first?' main':''}" type="button" data-h="book"><span class="mi">📖</span><b>ルールブック</b><small>${first?'はじめての人はここから（絵でわかる11ページ）':'絵でわかる11ページ'}</small></button>
      ${HASCLAUDE?"":"<!--"}<button class="mbtn" type="button" data-h="shared"${NET.ready?'':' disabled'}><span class="mi">🌐</span><b>みんなの街</b><small>${NET.ready?'みんなで1つの街を育てる':'この画面では使えません'}</small></button>${HASCLAUDE?"":"-->"}
      <button class="mbtn" type="button" data-h="notebook"><span class="mi">🏅</span><b>社長手帳</b><small>集めたバッジ ${(()=>{const g=store.get('azakei-city-badges')||{};return BADGES.filter(b=>g[b.id]).length})()}/${BADGES.length}</small></button>
    </div>
    <p class="homefoot">AZAKEI（麻経）・麻布中学校・高等学校 経済系同好会</p>
  </div>`;
  $('home').hidden=false;
  const f=$('home').querySelector('.cont,.mbtn.main'); if(f) f.focus();
}
function hideHome(){S.homeOpen=false;$('home').hidden=true}
$('home').addEventListener('click',e=>{
  const b=e.target.closest('[data-h]'); if(!b||b.disabled) return;
  const a=b.dataset.h; sfx.pick();
  if(a==='cont'){hideHome();if(S.mode!=='local')setMode('local');else{render();advance()}return}
  if(a==='new'||a==='short'||a==='daily'){SU.daily=a==='daily';SU.short=a==='short';showSetup();return}
  if(a==="book"){showRulebook(0);return}
  if(a==="chal"){showChallenges();return}
  if(a==='notebook'){showBook();return}
  if(a==='shared'){hideHome();setMode('shared');return}
});
$('toHome').onclick=showHome;
$("cityBtn").onclick=()=>{sfx.pick();toggleCity()};
$("cityWrap").onclick=()=>toggleCity(false);

/* ---------- shared town (db) ---------- */
function sortShared(){S.sharedTiles.sort((a,b)=>(a.t-b.t)||(a.id<b.id?-1:1))}
if(!HASCLAUDE) document.querySelector(".tabs").hidden=true;
$('mShared').disabled=true; $('mShared').title='共有の街に接続中…';
legend(); paintSound(); setTab(store.get('azakei-city-tab')||'rank');
if(S.game){const tp=turnPlayer();S.viewer=tp&&!tp.cpu?tp.key:(humans()[0]||{}).key}
render();
showHome();
if(!store.get('azakei-city-seen-rules')){$('rulesBox').open=true;store.set('azakei-city-seen-rules',true)}
(async()=>{
  if(!window.claude||!window.claude.use){$('mShared').title='この画面では使えません';return}
  try{
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db){$('mShared').title='この画面では使えません';return}
    NET.db=db;
    if(user){
      NET.uid=await user.id().catch(()=>null);
      NET.owner=!!(await Promise.resolve(user.isOwner()).catch(()=>false));
      const cw=await Promise.resolve(user.can?user.can('data.write'):null).catch(()=>null);
      if(cw===false) NET.canWrite=false;
    }
    db.collection('cells').onSnapshot(snap=>{
      S.sharedTiles=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>T[t.k]); sortShared();
      if(S.mode==='shared'&&!S.busy) render();
    },()=>{NET.err='共有の街との接続が切れました。ページを開き直してください。';if(S.mode==='shared')render()});
    NET.ready=true; $('mShared').disabled=false; $('mShared').title=''; if(S.homeOpen) showHome();
  }catch(e){$('mShared').title='この画面では使えません'}
})();
</script>
</body>
</html>
